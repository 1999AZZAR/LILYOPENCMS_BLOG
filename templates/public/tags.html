{% extends "designs/" + g.design + "/base.html" %}
{% block title %}Semua Tag — {{ brand_info.site_name }}{% endblock %}

{% block content %}
<main class="min-h-screen bg-white text-gray-900 pt-20">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
    <h1 class="text-3xl font-bold mb-8">Semua Tag</h1>

    {% if tags %}
    <div class="flex flex-wrap gap-3">
      {% for tag in tags %}
      <a href="{{ url_for('main.public_tag', slug=tag.slug) }}"
        class="inline-flex items-center gap-2 px-4 py-2 rounded-full bg-gray-100 text-gray-800 hover:bg-blue-100 hover:text-blue-800 transition-colors no-underline">
        <i class="fas fa-tag text-xs"></i>
        <span class="font-medium">{{ tag.name }}</span>
        <span class="text-xs text-gray-500">({{ tag.news.count() }})</span>
      </a>
      {% endfor %}
    </div>
    {% else %}
    <div class="text-center py-16">
      <div class="text-4xl mb-4">🏷️</div>
      <p class="text-gray-500">Belum ada tag.</p>
    </div>
    {% endif %}
  </div>
</main>
{% endblock %}
