# docker-compose.yml — LilyOpenCMS
# Usage:
#   Development:  docker compose up
#   Production:   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lilycms}
      POSTGRES_USER: ${POSTGRES_USER:-lily}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lily_secret}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5436}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lily}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis (caching / sessions) ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── LilyOpenCMS ─────────────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      FLASK_ENV: ${FLASK_ENV:-production}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      DATABASE_URI: postgresql+psycopg2://${POSTGRES_USER:-lily}:${POSTGRES_PASSWORD:-lily_secret}@db:5432/${POSTGRES_DB:-lilycms}
      REDIS_URL: redis://redis:6379/0
      ARGUS_HOST: argus-sidecar
      ARGUS_PORT: 50051
      HERMES_HOST: hermes-sidecar
      HERMES_PORT: 50052
      CEREBRO_HOST: cerebro-sidecar
      CEREBRO_PORT: 8080
    ports:
      - "${APP_PORT:-5000}:5000"
    volumes:
      - logsdata:/app/logs
      - app_data:/app/instance

  # ── Celery Worker (async task processing) ──────────────────────────────────
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=2
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      FLASK_ENV: ${FLASK_ENV:-production}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      DATABASE_URI: postgresql+psycopg2://${POSTGRES_USER:-lily}:${POSTGRES_PASSWORD:-lily_secret}@db:5432/${POSTGRES_DB:-lilycms}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - logsdata:/app/logs
      - app_data:/app/instance

  # ── Celery Beat (periodic task scheduler) ──────────────────────────────────
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A app.tasks.celery_app beat --loglevel=info
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      FLASK_ENV: ${FLASK_ENV:-production}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      DATABASE_URI: postgresql+psycopg2://${POSTGRES_USER:-lily}:${POSTGRES_PASSWORD:-lily_secret}@db:5432/${POSTGRES_DB:-lilycms}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - logsdata:/app/logs

  # ── Elasticsearch (for Argus + Cerebro search) ─────────────────────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms256m -Xmx256m
    volumes:
      - esdata:/usr/share/elasticsearch/data
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10

  # ── Argus Sidecar (gRPC :50051 — logging, analytics, metrics) ─────────────
  argus-sidecar:
    build:
      context: ./sidecars/argus
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: "50051"
      ELASTICSEARCH_URL: http://elasticsearch:9200
    ports:
      - "${ARGUS_PORT:-50051}:50051"
    depends_on:
      elasticsearch:
        condition: service_healthy

  # ── Hermes Sidecar (gRPC :50052 — image processing via libvips) ───────────
  hermes-sidecar:
    build:
      context: ./sidecars/hermes
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: "50052"
    ports:
      - "${HERMES_PORT:-50052}:50052"

  # ── Cerebro Sidecar (HTTP :8080 — cached read path, search gateway) ────────
  cerebro-sidecar:
    build:
      context: ./sidecars/cerebro
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: "8080"
      DATABASE_URL: postgresql://${POSTGRES_USER:-lily}:${POSTGRES_PASSWORD:-lily_secret}@db:5432/${POSTGRES_DB:-lilycms}
      REDIS_URL: redis://redis:6379/0
      ELASTICSEARCH_URL: http://elasticsearch:9200
    ports:
      - "${CEREBRO_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  esdata:
  app_data:
  logsdata:
